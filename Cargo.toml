[workspace]
members = [".", "mev"]

[package]
name = "amms"
version = "0.7.4"
edition = "2021"
license = "MIT"
description = "A library to interact with automated market makers across EVM chains."
readme = "README.md"
homepage = "https://github.com/darkforestry/amms-rs"
repository = "https://github.com/darkforestry/amms-rs"
keywords = ["ethereum", "amm", "mev"]
exclude = ["target/*", ".github/*", ".gitignore", "build.rs", "contracts/*"]


[dependencies]
# darkforest
uniswap_v3_math = "0.6.2"

# alloy
alloy = { version = "1.0.25", features = [
  "contract",
  "network",
  "rpc",
  "rpc-types",
  "provider-ws",
  "rpc-types-eth",
  "signer-local",
] }

# tracing
eyre = "0.6"
tracing = "0.1"

# async
tokio = { version = "1.42", default-features = false }
futures = "0.3"
async-trait = "0.1"

# misc
arraydeque = "0.5"
thiserror = "1.0"
rug = "1.24.1"
itertools = "0.14.0"
rayon = "1.11.0"
async-stream = "0.3.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Phase 5+: token-first discovery + Redis bridge
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "gzip", "brotli"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }


[dev-dependencies]
rand = "0.9.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.7"
tokio = { version = "1.42", default-features = false, features = [
  "rt-multi-thread",
] }
alloy = { version = "1.0.25", features = ["rpc-client"] }
alloy-provider = { version = "1.0.25", features = ["throttle"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"


[build-dependencies]
serde_json = "1.0"
rayon = "1"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 3
lto = true
codegen-units = 1
debug = "full"

# Iteration-friendly optimized profile. Pick when you're editing + restarting the
# token-first runner often: optimized enough that batch reads / sync stays snappy,
# but skips fat LTO and serializes-everything codegen so the link step is short.
# Runtime gap vs `release` on this codebase is < 5% (the heavy paths are HTTP / RPC
# bound). Build time is roughly 1/3 of `release`.
[profile.release-fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true


[[bench]]
name = "uniswap_v2"
harness = false

[[bench]]
name = "uniswap_v3"
harness = false

[[bench]]
name = "erc_4626"
harness = false
